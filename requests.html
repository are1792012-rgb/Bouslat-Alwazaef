<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>متابعة حالة طلب التوظيف</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>



/* Soft rising glow that appears and fades gently */
body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 50% 65%, rgba(255,170,80,0.22) 0%, rgba(255,170,80,0) 70%);
    filter: blur(35px);
    opacity: 0.0;
    animation: glowFade 14s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes glowFade {
    0%   { opacity: 0.0; transform: scale(1.02); }
    40%  { opacity: 0.32; transform: scale(1.05); }
    70%  { opacity: 0.18; transform: scale(1.03); }
    100% { opacity: 0.0; transform: scale(1.02); }
}

    50%  { transform: translate(3%, 3%) scale(1.12) rotate(180deg); }
    100% { transform: translate(-2%, 2%) scale(1.1) rotate(360deg); }
}


@keyframes rotateBeam {
    0%   { transform: rotate(0deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1.1); }
}

body {
    font-family: "Tajawal", sans-serif;
    background: linear-gradient(135deg, #0d1b3a, #1d3f73, #0d1b3a);
    padding: 20px;
    text-align: center;
    min-height: 100vh;
}
.box {
    background: rgba(15,23,42,0.80);
    color: #e5e7eb;
    padding: 25px;
    border-radius: 15px;
    max-width: 420px;
    margin: auto;
}
input {
    width: 90%;
    padding:8px;
    margin: 12px auto;
    font-size:15px;
    border-radius: 10px;
    border: 1px solid #ccc;
    text-align:center;
}
button { cursor:pointer; transition:.25s; }
button:hover { transform:scale(1.05); }
#result { margin-top:25px; font-size:18px; }
.pending { color:#d39e00; font-weight:bold; }
.accepted { color:#22c55e; font-weight:bold; }
.rejected { color:#ef4444; font-weight:bold; }

.modal { 
    display:none; 
    position:fixed; 
    inset:0;
    background:rgba(0,0,0,0.45); 
    justify-content:center; 
    align-items:center; 
}
.modal-box { 
    background:white; 
    padding:25px; 
    border-radius:15px; 
    max-width:300px; 
}

@media (max-width: 480px) {
  .box { max-width: 95%; padding: 15px; }
  input { width: 100%; font-size: 14px; padding: 8px; }
  button { font-size: 14px !important; padding: 8px !important; }
  #result { font-size: 16px; }
}

</style>

<style>
#modalOk {
    background: linear-gradient(145deg, #4CAF50, #43A047);
    color: white;
    padding: 10px 0;
    border: none;
    border-radius: 10px;
    width: 105px;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: 0.25s;
}
#modalOk:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.35);
}
#modalOk:active {
    transform: scale(0.96);
}
</style>

</head>

<body>

<div class="box">
    <h2>متابعة حالة طلب التوظيف</h2>
    <p>أدخل رقمك القومي لمعرفة حالة طلبك</p>

    <input type="text" id="nidInput" maxlength="14" placeholder="أدخل الرقم القومي">

    <button id="checkBtn" style="background:#007bff;color:white;padding:10px;border:none;border-radius:10px;width:100%;font-size:18px;">
        عرض الحالة
    </button>

    <div style="display:flex;gap:10px;justify-content:center;margin-top:15px;">
        <button id="clearBtn" style="background:#6c757d;color:white;padding:8px 0;border:none;border-radius:10px;font-size:15px;width:140px;">مسح الحقل</button>
        <button id="closeBtn" style="background:#dc3545;color:white;padding:8px 0;border:none;border-radius:10px;font-size:15px;width:140px;">إغلاق</button>
    </div>

    <div id="result"></div>
</div>

<div id="closeModal" class="modal">
  <div class="modal-box">
    <p>سيتم إغلاق صفحة المتابعة.<br>نتمنى لك يومًا سعيدًا 😊</p>
    <button id="modalOk">حسناً</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

    const clearBtn = document.getElementById("clearBtn");
    const closeBtn = document.getElementById("closeBtn");
    const checkBtn = document.getElementById("checkBtn");
    const nidInput = document.getElementById("nidInput");
    const result   = document.getElementById("result");
    const modal    = document.getElementById("closeModal");
    const okBtn    = document.getElementById("modalOk");

    nidInput.addEventListener("input", () => {
        nidInput.value = nidInput.value.replace(/[^0-9]/g, "").slice(0,14);
        const v = nidInput.value;

        if (!v) { result.innerHTML = ""; return; }
        if (v.length < 14) { 
            result.innerHTML = "<span class='pending'>الرقم القومي يجب أن يكون 14 رقمًا.</span>"; 
            return; 
        }

        result.innerHTML = "<span class='accepted'>الرقم القومي بالصيغة السليمة ✔</span>";

        setTimeout(() => {
            if (result.innerHTML.includes("بالصيغة السليمة")) {
                result.innerHTML = "";
            }
        }, 2000);
    });

    clearBtn.onclick = ()=> {
        nidInput.value = "";
        result.innerHTML = "";
    };

    closeBtn.onclick = ()=> {
        modal.style.display = "flex";
    };

    okBtn.onclick = ()=> {
        modal.style.display = "none";
        window.location.href = "index.html";
    };

    checkBtn.onclick = ()=> {
        const nid = nidInput.value.trim();
        if(!/^[0-9]{14}$/.test(nid)) {
            result.innerHTML = "<span class='pending'>الرقم القومي يجب أن يكون 14 رقمًا.</span>";
            return;
        }
        result.innerHTML = "<span class='pending'>لا يوجد اتصال بالسيرفر الآن. هذه نسخة بدون Firebase.</span>";
    };

});
</script>
